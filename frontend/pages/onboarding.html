<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAYbrand — 브랜드 등록</title>
  <script>(function(){document.documentElement.setAttribute('data-theme','dark');}());</script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#1a6ef8',600:'#1558cc'}}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'NanumSquare', 'Noto Sans KR', sans-serif; background: #0a0f1e; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #0c1428; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; width: 100%; max-width: 480px; padding: 40px; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .step-dot.active { background: #1a6ef8; }
    label { display: block; font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
    input, select { width: 100%; background: #0a0f1e; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: #e2e8f0; outline: none; transition: border-color .15s; font-family: inherit; }
    input:focus, select:focus { border-color: #1a6ef8; }
    select option { background: #0c1428; }
    .type-btn { flex: 1; padding: 12px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; background: transparent; color: #94a3b8; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s; text-align: center; font-family: inherit; }
    .type-btn.selected { border-color: #1a6ef8; background: rgba(26,110,248,0.12); color: #1a6ef8; }
    .btn-primary { width: 100%; padding: 13px; background: #1a6ef8; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; font-family: inherit; }
    .btn-primary:hover { background: #1558cc; }
    .btn-primary:disabled { background: #1a3a6e; color: rgba(255,255,255,0.4); cursor: not-allowed; }
    .error-msg { color: #f87171; font-size: 12px; margin-top: 4px; display: none; }
  </style>
</head>
<body>

<div class="card">

  <!-- 로고 -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:32px;">
    <img src="/saybrand-logo2.png" alt="" style="width:28px;height:auto;filter:brightness(1.8);" onerror="this.style.display='none'" />
    <span style="font-size:16px;font-weight:700;color:#fff;letter-spacing:-.02em;">SAYbrand</span>
  </div>

  <!-- 헤더 -->
  <div style="margin-bottom:28px;">
    <h1 style="font-size:22px;font-weight:800;color:#fff;margin-bottom:8px;letter-spacing:-.03em;">브랜드를 등록해주세요</h1>
    <p style="font-size:13px;color:#64748b;line-height:1.6;">모니터링할 브랜드 정보를 입력하면<br/>바로 위협 탐지를 시작합니다.</p>
  </div>

  <!-- 폼 -->
  <form id="onboarding-form" style="display:flex;flex-direction:column;gap:20px;">

    <!-- 프로파일 유형 -->
    <div>
      <label>유형</label>
      <div style="display:flex;gap:8px;">
        <button type="button" class="type-btn selected" data-value="company" onclick="selectType('company')">🏢 기업</button>
        <button type="button" class="type-btn" data-value="individual" onclick="selectType('individual')">👤 개인/인플루언서</button>
      </div>
      <input type="hidden" id="profile-type" value="company" />
    </div>

    <!-- 브랜드명 -->
    <div>
      <label for="display-name">브랜드명 <span style="color:#ef4444;">*</span></label>
      <input type="text" id="display-name" placeholder="예: 삼성전자, 올리브영, 김철수" maxlength="100" autocomplete="off" />
      <p class="error-msg" id="name-error">브랜드명을 입력해주세요.</p>
    </div>

    <!-- 업종 -->
    <div>
      <label for="industry">업종</label>
      <select id="industry">
        <option value="">선택 안함</option>
        <option value="food_beverage">식품·음료</option>
        <option value="cosmetics">뷰티·화장품</option>
        <option value="fashion">패션·의류</option>
        <option value="tech">IT·테크</option>
        <option value="finance">금융·핀테크</option>
        <option value="healthcare">의료·헬스케어</option>
        <option value="entertainment">엔터테인먼트</option>
        <option value="retail">유통·이커머스</option>
        <option value="manufacturing">제조업</option>
        <option value="influencer">인플루언서·크리에이터</option>
        <option value="other">기타</option>
      </select>
    </div>

    <!-- 제출 -->
    <button type="submit" class="btn-primary" id="submit-btn">
      브랜드 등록하고 시작하기 →
    </button>

  </form>

  <!-- 에러 -->
  <p id="global-error" style="color:#f87171;font-size:13px;margin-top:16px;text-align:center;display:none;"></p>

</div>

<script>
  function selectType(value) {
    document.getElementById('profile-type').value = value;
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.value === value);
    });
  }

  document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('display-name').value.trim();
    const nameError = document.getElementById('name-error');

    if (!name) {
      nameError.style.display = 'block';
      document.getElementById('display-name').focus();
      return;
    }
    nameError.style.display = 'none';

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '등록 중...';

    const payload = {
      profile_type: document.getElementById('profile-type').value,
      display_name: name,
      industry: document.getElementById('industry').value || null,
    };

    try {
      const res = await fetch('/api/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || `서버 오류 (${res.status})`);
      }
    } catch (err) {
      const globalError = document.getElementById('global-error');
      globalError.textContent = err.message;
      globalError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '브랜드 등록하고 시작하기 →';
    }
  });
</script>

</body>
</html>
