<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a6ef8" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <script src="/assets/js/pwa.js" defer></script>
  <title>SAYbrand — 시작하기</title>
  <script>(function(){document.documentElement.setAttribute('data-theme','dark');}());</script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#1a6ef8',600:'#1558cc'}}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'NanumSquare', 'Noto Sans KR', sans-serif; background: #0a0f1e; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #0c1428; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; width: 100%; max-width: 500px; padding: 40px; }
    label { display: block; font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
    input, select { width: 100%; background: #0a0f1e; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: #e2e8f0; outline: none; transition: border-color .15s; font-family: inherit; box-sizing: border-box; }
    input:focus, select:focus { border-color: #1a6ef8; }
    select option { background: #0c1428; }
    input.font-mono { font-family: 'JetBrains Mono', monospace; letter-spacing: .05em; }
    .path-card { border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; cursor: pointer; transition: all .15s; background: transparent; text-align: left; width: 100%; }
    .path-card:hover { border-color: rgba(26,110,248,0.4); background: rgba(26,110,248,0.04); }
    .path-card.selected { border-color: #1a6ef8; background: rgba(26,110,248,0.1); }
    .type-btn { flex: 1; padding: 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; background: transparent; color: #94a3b8; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s; text-align: center; font-family: inherit; }
    .type-btn.selected { border-color: #1a6ef8; background: rgba(26,110,248,0.12); color: #1a6ef8; }
    .btn-primary { width: 100%; padding: 13px; background: #1a6ef8; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; font-family: inherit; }
    .btn-primary:hover { background: #1558cc; }
    .btn-primary:disabled { background: #1a3a6e; color: rgba(255,255,255,0.4); cursor: not-allowed; }
    .btn-secondary { padding: 9px 18px; background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; font-family: inherit; }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.3); color: #e2e8f0; }
    .btn-dart { padding: 10px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .15s; font-family: inherit; flex-shrink: 0; }
    .btn-dart:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
    .error-msg { color: #f87171; font-size: 12px; margin-top: 4px; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background .2s; }
    .step-dot.active { background: #1a6ef8; }
    .step-dot.done { background: rgba(26,110,248,0.4); }
    .step { display: none; }
    .step.active { display: block; }
    .dart-ok { color: #4ade80; font-size: 12px; margin-top: 6px; }
    .dart-err { color: #f87171; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>

<div class="card">

  <!-- 로고 -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px;">
    <img src="/saybrand-logo2.png" alt="" style="width:26px;height:auto;filter:brightness(1.8);" onerror="this.style.display='none'" />
    <span style="font-size:15px;font-weight:700;color:#fff;letter-spacing:-.02em;">SAYbrand</span>
  </div>

  <!-- 진행 표시 -->
  <div id="progress-wrap" style="display:flex;align-items:center;gap:6px;margin-bottom:28px;">
    <div class="step-dot active" id="dot-1"></div>
    <div class="step-dot" id="dot-2"></div>
    <div class="step-dot" id="dot-3"></div>
    <span id="step-label" style="margin-left:8px;font-size:12px;color:#475569;font-weight:600;">1단계 · 시작 방법 선택</span>
  </div>

  <!-- ─── STEP 1: 경로 선택 ─────────────────────────────────── -->
  <div class="step active" id="step-1">
    <h1 style="font-size:21px;font-weight:800;color:#fff;margin-bottom:6px;letter-spacing:-.03em;">어떻게 시작할까요?</h1>
    <p style="font-size:13px;color:#64748b;margin-bottom:24px;line-height:1.6;">팀과 함께 쓸 수 있고, 나중에 언제든 바꿀 수 있어요.</p>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:28px;">
      <button class="path-card" id="path-new-org" onclick="selectPath('new-org')">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:22px;">🏢</span>
          <div>
            <div style="font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:2px;">새 조직 만들기</div>
            <div style="font-size:12px;color:#64748b;">팀을 직접 만들고 멤버를 초대합니다</div>
          </div>
        </div>
      </button>
      <button class="path-card" id="path-join-org" onclick="selectPath('join-org')">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:22px;">🔗</span>
          <div>
            <div style="font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:2px;">초대코드로 팀 합류</div>
            <div style="font-size:12px;color:#64748b;">기존 조직의 초대코드를 입력합니다</div>
          </div>
        </div>
      </button>
      <button class="path-card" id="path-solo" onclick="selectPath('solo')">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:22px;">👤</span>
          <div>
            <div style="font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:2px;">개인으로 시작</div>
            <div style="font-size:12px;color:#64748b;">나중에 팀에 합류하거나 만들 수 있어요</div>
          </div>
        </div>
      </button>
    </div>

    <button class="btn-primary" id="btn-step1-next" onclick="goStep2()" disabled>다음 →</button>
    <p id="err-step1" class="error-msg" style="text-align:center;margin-top:10px;display:none;"></p>
  </div>

  <!-- ─── STEP 2a: 새 조직 만들기 ──────────────────────────── -->
  <div class="step" id="step-2a">
    <h1 style="font-size:21px;font-weight:800;color:#fff;margin-bottom:6px;letter-spacing:-.03em;">조직 이름을 정해주세요</h1>
    <p style="font-size:13px;color:#64748b;margin-bottom:24px;">나중에 설정에서 변경할 수 있습니다.</p>

    <div style="margin-bottom:20px;">
      <label for="org-name">조직 이름 <span style="color:#ef4444;">*</span></label>
      <input type="text" id="org-name" placeholder="예: 올리브영 브랜드팀, ABC Corp" maxlength="100" autocomplete="off" />
      <p class="error-msg" id="err-org-name" style="display:none;"></p>
    </div>

    <button class="btn-primary" id="btn-create-org" onclick="createOrg()">조직 만들기 →</button>
    <p id="err-step2a" class="error-msg" style="text-align:center;margin-top:10px;display:none;"></p>
    <button class="btn-secondary" onclick="goStep1()" style="width:100%;margin-top:10px;">← 뒤로</button>
  </div>

  <!-- ─── STEP 2b: 초대코드 입력 ───────────────────────────── -->
  <div class="step" id="step-2b">
    <h1 style="font-size:21px;font-weight:800;color:#fff;margin-bottom:6px;letter-spacing:-.03em;">초대코드를 입력하세요</h1>
    <p style="font-size:13px;color:#64748b;margin-bottom:24px;">팀장에게 초대코드를 받아 입력해 주세요.</p>

    <div style="margin-bottom:20px;">
      <label for="invite-code">초대코드 <span style="color:#ef4444;">*</span></label>
      <input type="text" id="invite-code" placeholder="예: ABC12345" maxlength="20" autocomplete="off" class="font-mono" style="text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()" />
      <p class="error-msg" id="err-invite-code" style="display:none;"></p>
    </div>

    <button class="btn-primary" id="btn-join-org" onclick="joinOrg()">팀 합류하기 →</button>
    <p id="err-step2b" class="error-msg" style="text-align:center;margin-top:10px;display:none;"></p>
    <button class="btn-secondary" onclick="goStep1()" style="width:100%;margin-top:10px;">← 뒤로</button>
  </div>

  <!-- ─── STEP 3: 브랜드 등록 ───────────────────────────────── -->
  <div class="step" id="step-3">
    <h1 style="font-size:21px;font-weight:800;color:#fff;margin-bottom:6px;letter-spacing:-.03em;">브랜드를 등록해주세요</h1>
    <p style="font-size:13px;color:#64748b;margin-bottom:24px;line-height:1.6;">모니터링할 브랜드 정보를 입력하면 바로 위협 탐지를 시작합니다.</p>

    <form id="brand-form" style="display:flex;flex-direction:column;gap:18px;" onsubmit="submitBrand(event)">

      <!-- 유형 -->
      <div>
        <label>유형</label>
        <div style="display:flex;gap:8px;">
          <button type="button" class="type-btn selected" data-value="company" onclick="selectType('company')">🏢 기업</button>
          <button type="button" class="type-btn" data-value="individual" onclick="selectType('individual')">👤 개인/인플루언서</button>
        </div>
        <input type="hidden" id="profile-type" value="company" />
      </div>

      <!-- 브랜드명 -->
      <div>
        <label for="display-name">브랜드명 <span style="color:#ef4444;">*</span></label>
        <input type="text" id="display-name" placeholder="예: 삼성전자, 올리브영, 김철수" maxlength="100" autocomplete="off" />
        <p class="error-msg" id="err-display-name" style="display:none;">브랜드명을 입력해주세요.</p>
      </div>

      <!-- DART 코드 -->
      <div>
        <label for="dart-code">DART 기업코드 <span style="color:#475569;font-weight:400;">(상장사 선택)</span></label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="dart-code" placeholder="8자리 코드 입력 후 조회" maxlength="8" class="font-mono" />
          <button type="button" class="btn-dart" id="btn-dart" onclick="lookupDart()">조회</button>
        </div>
        <p id="dart-msg" style="display:none;font-size:12px;margin-top:6px;"></p>
        <p style="font-size:11px;color:#475569;margin-top:4px;">DART에서 기업코드 조회 → 브랜드명·업종 자동 입력</p>
      </div>

      <!-- 업종 -->
      <div>
        <label for="industry">업종</label>
        <select id="industry">
          <option value="">선택 안함</option>
          <option value="food_beverage">식품·음료</option>
          <option value="cosmetics">뷰티·화장품</option>
          <option value="fashion">패션·의류</option>
          <option value="tech">IT·테크</option>
          <option value="finance">금융·핀테크</option>
          <option value="healthcare">의료·헬스케어</option>
          <option value="entertainment">엔터테인먼트</option>
          <option value="retail">유통·이커머스</option>
          <option value="manufacturing">제조업</option>
          <option value="influencer">인플루언서·크리에이터</option>
          <option value="other">기타</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" id="btn-submit-brand">
        등록하고 시작하기 →
      </button>
    </form>

    <p id="err-brand" class="error-msg" style="text-align:center;margin-top:10px;display:none;"></p>
  </div>

</div>

<script>
  let selectedPath = null;

  // ── 경로 선택 ────────────────────────────────────────────────
  function selectPath(path) {
    selectedPath = path;
    ['new-org', 'join-org', 'solo'].forEach(p => {
      document.getElementById('path-' + p).classList.toggle('selected', p === path);
    });
    document.getElementById('btn-step1-next').disabled = false;
  }

  function goStep1() {
    showStep('step-1');
    updateProgress(1, false);
  }

  function goStep2() {
    if (!selectedPath) return;
    if (selectedPath === 'solo') {
      showStep('step-3');
      updateProgress(2, true);
      return;
    }
    if (selectedPath === 'new-org') {
      showStep('step-2a');
    } else {
      showStep('step-2b');
    }
    updateProgress(2, false);
  }

  // ── 진행 표시 ────────────────────────────────────────────────
  function updateProgress(currentStep, isSolo) {
    const totalSteps = isSolo ? 2 : 3;
    const labels = ['시작 방법 선택', '조직 설정', '브랜드 등록'];
    const soloLabels = ['시작 방법 선택', '브랜드 등록'];
    const labelArr = isSolo ? soloLabels : labels;

    const dots = [
      document.getElementById('dot-1'),
      document.getElementById('dot-2'),
      document.getElementById('dot-3'),
    ];

    if (isSolo) {
      dots[2].style.display = 'none';
    } else {
      dots[2].style.display = '';
    }

    dots.forEach((d, i) => {
      const stepNum = i + 1;
      d.classList.remove('active', 'done');
      if (stepNum < currentStep) d.classList.add('done');
      else if (stepNum === currentStep) d.classList.add('active');
    });

    document.getElementById('step-label').textContent =
      `${currentStep}단계 · ${labelArr[currentStep - 1] || ''}`;
  }

  function showStep(id) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    if (id === 'step-3') {
      const isSolo = selectedPath === 'solo';
      updateProgress(isSolo ? 2 : 3, isSolo);
    }
  }

  // ── 조직 만들기 ─────────────────────────────────────────────
  async function createOrg() {
    const name = document.getElementById('org-name').value.trim();
    const errName = document.getElementById('err-org-name');
    const errGlobal = document.getElementById('err-step2a');

    errName.style.display = 'none';
    errGlobal.style.display = 'none';

    if (!name) {
      errName.textContent = '조직 이름을 입력해주세요.';
      errName.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btn-create-org');
    btn.disabled = true;
    btn.textContent = '생성 중...';

    try {
      const org = await apiFetch('/api/orgs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      await apiFetch(`/api/orgs/${org.id}/switch`, { method: 'POST' });
      showStep('step-3');
    } catch (e) {
      errGlobal.textContent = e.message;
      errGlobal.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = '조직 만들기 →';
    }
  }

  // ── 초대코드 합류 ────────────────────────────────────────────
  async function joinOrg() {
    const code = document.getElementById('invite-code').value.trim();
    const errCode = document.getElementById('err-invite-code');
    const errGlobal = document.getElementById('err-step2b');

    errCode.style.display = 'none';
    errGlobal.style.display = 'none';

    if (!code) {
      errCode.textContent = '초대코드를 입력해주세요.';
      errCode.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btn-join-org');
    btn.disabled = true;
    btn.textContent = '합류 중...';

    try {
      const result = await apiFetch('/api/orgs/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      if (result.status === 'active' && result.org_id) {
        await apiFetch(`/api/orgs/${result.org_id}/switch`, { method: 'POST' });
      } else if (result.status === 'pending') {
        errGlobal.textContent = '가입 요청이 전송됐습니다. 관리자 승인 후 팀 기능을 사용할 수 있습니다.';
        errGlobal.style.color = '#fbbf24';
        errGlobal.style.display = 'block';
      }
      showStep('step-3');
    } catch (e) {
      errGlobal.textContent = e.message;
      errGlobal.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = '팀 합류하기 →';
    }
  }

  // ── 유형 선택 ────────────────────────────────────────────────
  function selectType(value) {
    document.getElementById('profile-type').value = value;
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.value === value);
    });
  }

  // ── DART 조회 ────────────────────────────────────────────────
  async function lookupDart() {
    const code = document.getElementById('dart-code').value.trim();
    const msgEl = document.getElementById('dart-msg');

    msgEl.className = '';
    msgEl.style.display = 'none';

    if (!code || code.length !== 8) {
      msgEl.textContent = '8자리 DART 기업코드를 입력해주세요.';
      msgEl.className = 'dart-err';
      msgEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btn-dart');
    btn.disabled = true;
    btn.textContent = '조회 중...';

    try {
      const r = await apiFetch(`/api/profile/dart-lookup?code=${encodeURIComponent(code)}`);
      document.getElementById('display-name').value = r.corp_name || '';
      if (r.industry) {
        const sel = document.getElementById('industry');
        const opt = [...sel.options].find(o => o.value === r.industry);
        if (opt) sel.value = r.industry;
      }
      msgEl.textContent = `✓ ${r.corp_name}${r.ceo_name ? ' · 대표: ' + r.ceo_name : ''}`;
      msgEl.className = 'dart-ok';
      msgEl.style.display = 'block';
    } catch (e) {
      msgEl.textContent = e.message || 'DART 조회에 실패했습니다.';
      msgEl.className = 'dart-err';
      msgEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = '조회';
    }
  }

  // ── 브랜드 등록 ─────────────────────────────────────────────
  async function submitBrand(e) {
    e.preventDefault();

    const name = document.getElementById('display-name').value.trim();
    const errName = document.getElementById('err-display-name');
    const errGlobal = document.getElementById('err-brand');

    errName.style.display = 'none';
    errGlobal.style.display = 'none';

    if (!name) {
      errName.style.display = 'block';
      document.getElementById('display-name').focus();
      return;
    }

    const btn = document.getElementById('btn-submit-brand');
    btn.disabled = true;
    btn.textContent = '등록 중...';

    try {
      await apiFetch('/api/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          profile_type: document.getElementById('profile-type').value,
          display_name: name,
          industry: document.getElementById('industry').value || null,
          dart_corp_code: document.getElementById('dart-code').value.trim() || null,
        }),
      });
      window.location.href = '/dashboard';
    } catch (e) {
      errGlobal.textContent = e.message;
      errGlobal.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '등록하고 시작하기 →';
    }
  }

  // ── 공통 fetch 헬퍼 ─────────────────────────────────────────
  async function apiFetch(url, options = {}) {
    const res = await fetch(url, options);
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || `서버 오류 (${res.status})`);
    }
    if (res.status === 204) return null;
    return res.json();
  }
</script>

</body>
</html>
