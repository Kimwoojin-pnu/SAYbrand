<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a6ef8" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <script src="/assets/js/pwa.js" defer></script>
  <title>SAYbrand — 처리 내역</title>
  <script>(function(){var t=localStorage.getItem('db-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}());</script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#1a6ef8'}}}}}</script>
</head>
<body style="font-family:'NanumSquare','Noto Sans KR',sans-serif;background:var(--db-bg);color:var(--db-text-1);">
<div style="display:flex;height:100vh;overflow:hidden;">

  <!-- Sidebar -->
  <aside style="background:#0c1428;width:200px;flex-shrink:0;display:flex;flex-direction:column;">
    <a href="/" style="display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,0.08);text-decoration:none;">
      <div style="width:34px;height:34px;overflow:hidden;flex-shrink:0;"><img src="/saybrand-logo2.png" alt="" style="width:34px;height:auto;display:block;filter:brightness(1.8);" onerror="this.parentElement.style.display='none'" /></div>
      <span style="font-weight:700;font-size:15px;color:#ffffff;letter-spacing:-.02em;line-height:1;">SAYbrand</span>
    </a>
    <nav style="flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;">
      <a href="/dashboard" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>대시보드</a>
      <a href="/threats" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>현재 위협</a>
      <a href="/actions" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>처리해야할 사항</a>
      <a href="/brand-image" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>브랜드 이미지</a>
      <a href="/negative-mentions" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>피드백</a>
      <a href="/reports" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>보고서</a>
      <a href="/history" class="db-nav-item db-nav-active"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>처리 내역</a>
    </nav>
    <div style="padding:12px 14px;border-top:1px solid rgba(255,255,255,0.08);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <img id="user-avatar" src="" alt="" style="width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;display:none;" />
        <div id="user-avatar-fallback" style="width:26px;height:26px;border-radius:50%;background:#1a6ef8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;">?</div>
        <div style="min-width:0;"><p id="user-name" style="font-size:11px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">로딩 중...</p><p id="user-email" style="font-size:10px;color:rgba(255,255,255,0.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></p></div>
      </div>
      <a href="/settings" class="db-nav-item" style="padding:5px 8px;font-size:11px;"><svg style="width:13px;height:13px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M20 12h2M2 12h2M12 20v2M12 2v2"/></svg>설정</a>
      <a href="/auth/logout" class="db-nav-item" style="padding:5px 8px;font-size:11px;"><svg style="width:13px;height:13px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>로그아웃</a>
    </div>
  </aside>

  <!-- Main -->
  <main class="db-main" style="flex:1;overflow-y:auto;background:var(--db-bg);">
    <header class="db-topheader" style="position:sticky;top:0;z-index:10;background:var(--db-surface);border-bottom:1px solid var(--db-border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h1 style="font-weight:800;font-size:15px;color:var(--db-text-1);letter-spacing:-.02em;">처리 내역</h1>
        <p style="font-size:10px;color:var(--db-text-3);margin-top:1px;">팀원들이 처리한 위협 조치 기록</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button onclick="loadLogs(1)" style="padding:5px 12px;border-radius:5px;background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.10);color:var(--db-text-2);font-size:12px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">새로고침</button>
        <button class="db-theme-toggle" id="theme-toggle" aria-label="다크모드 전환">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div style="padding:20px 24px;">

      <!-- 접근 거부 (Viewer) -->
      <div id="access-denied" style="display:none;">
        <div class="db-card" style="padding:40px;text-align:center;">
          <svg style="width:40px;height:40px;color:var(--db-text-3);margin:0 auto 12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
          <p style="font-size:14px;font-weight:700;color:var(--db-text-1);margin-bottom:6px;">접근 권한 없음</p>
          <p style="font-size:12px;color:var(--db-text-3);">처리 내역은 팀원 이상만 조회할 수 있습니다.</p>
        </div>
      </div>

      <!-- 로딩 -->
      <div id="loading-state" style="display:flex;justify-content:center;padding:60px;">
        <p style="font-size:12px;color:var(--db-text-3);">로딩 중...</p>
      </div>

      <!-- 로그 테이블 -->
      <div id="log-container" style="display:none;">
        <div class="db-card" style="overflow:hidden;padding:0;">
          <div style="padding:14px 16px;border-bottom:1px solid var(--db-border);display:flex;align-items:center;justify-content:space-between;">
            <span id="log-count" style="font-size:12px;color:var(--db-text-3);">총 0건</span>
            <span style="font-size:11px;color:var(--db-text-3);">최근 7일 보관 · Admin 이상 삭제 가능</span>
          </div>
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;">
              <thead>
                <tr style="background:var(--db-surface-50,rgba(0,0,0,.02));">
                  <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--db-text-3);white-space:nowrap;">처리 시각</th>
                  <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--db-text-3);">팀원</th>
                  <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--db-text-3);">유형</th>
                  <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--db-text-3);">상세</th>
                  <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:700;color:var(--db-text-3);width:60px;">삭제</th>
                </tr>
              </thead>
              <tbody id="log-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- 페이지네이션 -->
        <div id="pagination" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 0;"></div>
      </div>

    </div>
  </main>
</div>

<!-- 토스트 -->
<div id="toast-wrap" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>

<script>
(function(){var t=localStorage.getItem('db-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}());
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.getElementById('theme-toggle');
  if (toggle) toggle.addEventListener('click', function() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('db-theme', next);
  });
});

fetch('/auth/me').then(r => { if (!r.ok) { location.href = '/login'; return; } return r.json(); })
  .then(user => {
    if (!user) return;
    document.getElementById('user-name').textContent = user.name || user.email;
    document.getElementById('user-email').textContent = user.email;
    if (user.avatar_url) {
      const img = document.getElementById('user-avatar');
      img.src = user.avatar_url; img.style.display = 'block';
      document.getElementById('user-avatar-fallback').style.display = 'none';
    } else {
      document.getElementById('user-avatar-fallback').textContent = (user.name || user.email || '?')[0].toUpperCase();
    }
  }).catch(() => { location.href = '/login'; });

// ── 상수 ─────────────────────────────────────────────────────────────────────

const ACTION_LABEL = {
  'dismiss':        '경미 처리',
  'archive':        '조치 완료',
  'resolve':        '해결됨',
  'status_change':  '상태 변경',
  'report_archive': '보고서 보관',
  'delete':         '삭제',
};

const ACTION_COLOR = {
  'dismiss':        '#6b7280',
  'archive':        '#1D9E75',
  'resolve':        '#1a6ef8',
  'status_change':  '#8b5cf6',
  'report_archive': '#ea580c',
  'delete':         '#E24B4A',
};

let _page = 1;
let _total = 0;
const _pageSize = 20;

// ── 로그 로드 ─────────────────────────────────────────────────────────────────

async function loadLogs(page) {
  _page = page || 1;
  document.getElementById('loading-state').style.display = 'flex';
  document.getElementById('log-container').style.display = 'none';
  document.getElementById('access-denied').style.display = 'none';

  try {
    const r = await fetch(`/api/activity/logs?page=${_page}&page_size=${_pageSize}`);
    if (r.status === 401) { location.href = '/login'; return; }
    if (r.status === 403) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('access-denied').style.display = 'block';
      return;
    }
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    _total = data.total;
    renderLogs(data.items);
    renderPagination();
    document.getElementById('log-count').textContent = `총 ${_total}건`;
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('log-container').style.display = 'block';
  } catch(e) {
    document.getElementById('loading-state').innerHTML = `<p style="font-size:12px;color:#E24B4A;">로드 실패: ${e.message}</p>`;
  }
}

// ── 렌더링 ────────────────────────────────────────────────────────────────────

function renderLogs(items) {
  const tbody = document.getElementById('log-tbody');
  if (!items || !items.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="padding:48px;text-align:center;font-size:12px;color:var(--db-text-3);">처리 내역이 없습니다.</td></tr>`;
    return;
  }
  tbody.innerHTML = items.map(log => {
    const label = ACTION_LABEL[log.action_type] || log.action_type;
    const color = ACTION_COLOR[log.action_type] || '#94a3b8';
    const badge = `<span style="display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:${color}22;color:${color};">${label}</span>`;
    const delBtn = `<button onclick="deleteLog(${log.id},this)" style="padding:3px 8px;border-radius:4px;border:1px solid rgba(226,75,74,.35);color:#E24B4A;background:transparent;font-size:11px;font-weight:700;cursor:pointer;font-family:'NanumSquare',sans-serif;">삭제</button>`;
    return `<tr style="border-top:1px solid var(--db-border);">
      <td style="padding:10px 14px;font-size:11px;color:var(--db-text-3);white-space:nowrap;font-family:'JetBrains Mono',monospace;">${fmtDate(log.created_at)}</td>
      <td style="padding:10px 14px;font-size:12px;color:var(--db-text-1);font-weight:700;">${esc(log.user_name || '알 수 없음')}</td>
      <td style="padding:10px 14px;">${badge}</td>
      <td style="padding:10px 14px;font-size:12px;color:var(--db-text-2);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(log.action_detail||'')}">${esc(log.action_detail || '—')}</td>
      <td style="padding:10px 14px;text-align:center;">${delBtn}</td>
    </tr>`;
  }).join('');
}

function renderPagination() {
  const totalPages = Math.ceil(_total / _pageSize);
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  const btnStyle = (disabled) =>
    `padding:5px 14px;border-radius:5px;border:1px solid var(--db-border);background:var(--db-surface);color:var(--db-text-2);font-size:12px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:${disabled?'not-allowed':'pointer'};opacity:${disabled?.4:1};`;
  el.innerHTML = `
    <button onclick="loadLogs(${_page-1})" ${_page<=1?'disabled':''} style="${btnStyle(_page<=1)}">← 이전</button>
    <span style="font-size:12px;color:var(--db-text-2);padding:0 4px;">${_page} / ${totalPages}</span>
    <button onclick="loadLogs(${_page+1})" ${_page>=totalPages?'disabled':''} style="${btnStyle(_page>=totalPages)}">다음 →</button>
  `;
}

// ── 삭제 ─────────────────────────────────────────────────────────────────────

async function deleteLog(id, btn) {
  if (!confirm('이 기록을 삭제하시겠습니까?')) return;
  btn.disabled = true;
  try {
    const r = await fetch(`/api/activity/logs/${id}`, { method: 'DELETE' });
    if (r.ok) {
      btn.closest('tr').remove();
      _total = Math.max(0, _total - 1);
      document.getElementById('log-count').textContent = `총 ${_total}건`;
      showToast('삭제했습니다.');
    } else {
      const err = await r.json().catch(() => ({}));
      showToast(err.detail || '삭제 권한이 없습니다.', 'error');
      btn.disabled = false;
    }
  } catch(e) {
    showToast('삭제 실패: ' + e.message, 'error');
    btn.disabled = false;
  }
}

// ── 유틸 ─────────────────────────────────────────────────────────────────────

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', {month:'2-digit',day:'2-digit'}) + ' ' +
         d.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit',hour12:false});
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type='success') {
  const wrap = document.getElementById('toast-wrap'); if (!wrap) return;
  const color = type === 'error' ? '#E24B4A' : '#1D9E75';
  const el = document.createElement('div');
  el.style.cssText = `display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--db-surface);border:1px solid var(--db-border);border-left:3px solid ${color};border-radius:8px;box-shadow:rgba(12,20,40,.14) 0 4px 16px;font-size:12px;font-family:'NanumSquare',sans-serif;pointer-events:auto;transform:translateX(120%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);min-width:240px;`;
  el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0;"></span><span style="color:var(--db-text-1);">${msg}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transform = 'translateX(0)'; }));
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; setTimeout(() => el.remove(), 400); }, 3500);
}

// ── 초기화 ────────────────────────────────────────────────────────────────────
loadLogs(1);
</script>
</body>
</html>
