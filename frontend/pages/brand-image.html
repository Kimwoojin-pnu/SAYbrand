      </button>
    </header>

    <div style="padding:20px;display:flex;flex-direction:column;gap:16px;">

      <!-- Brand Health Score -->
      <div class="db-card" style="padding:24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
          <div>

            </div>
            <p id="health-label" style="font-size:12px;font-weight:700;color:#1D9E75;margin-top:4px;">—</p>
          </div>
          <div style="display:flex;gap:24px;">
            <div style="text-align:center;">
              <p id="metric-positive" style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:24px;color:#1D9E75;">—</p>
              <p style="font-size:10px;color:rgba(12,20,40,.40);margin-top:2px;">긍정 지수</p>
            </div>
            <div style="text-align:center;">
              <p id="metric-neutral" style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:24px;color:#185FA5;">—</p>
              <p style="font-size:10px;color:rgba(12,20,40,.40);margin-top:2px;">중립 지수</p>
            </div>
            <div style="text-align:center;">
              <p id="metric-negative" style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:24px;color:#E24B4A;">—</p>
              <p style="font-size:10px;color:rgba(12,20,40,.40);margin-top:2px;">부정 지수</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts row -->
      <div class="db-two-col-grid" style="display:grid;grid-template-columns:280px 1fr;gap:14px;">

        <!-- Sentiment Donut -->
        <div class="db-card">
          <h3 style="font-weight:700;font-size:13px;letter-spacing:-.01em;margin-bottom:14px;">감성 분포</h3>
          <div style="height:180px;position:relative;display:flex;align-items:center;justify-content:center;">
            <canvas id="sentimentChart"></canvas>
          </div>
          <div id="sentiment-legend" style="display:flex;flex-direction:column;gap:6px;margin-top:12px;"></div>
        </div>

        <!-- Platform bars -->
        <div class="db-card">
          <h3 style="font-weight:700;font-size:13px;letter-spacing:-.01em;margin-bottom:14px;">플랫폼별 부정 언급 비율</h3>

      </div>

      <!-- Module breakdown -->
      <div class="db-card">
        <h3 style="font-weight:700;font-size:13px;letter-spacing:-.01em;margin-bottom:16px;">위협 모듈별 브랜드 영향도</h3>

          <div style="padding:16px;background:rgba(226,75,74,.05);border-radius:8px;border:1px solid rgba(226,75,74,.12);">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
              <span style="width:24px;height:24px;border-radius:4px;background:rgba(226,75,74,.12);color:#E24B4A;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;">A</span>
              <span style="font-size:12px;font-weight:700;color:rgba(12,20,40,.80);">브랜드 사칭</span>
            </div>
            <p id="module-a-score" style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:28px;color:#E24B4A;">—</p>
            <p id="module-a-count" style="font-size:11px;color:rgba(12,20,40,.40);margin-top:2px;">— 건 탐지</p>
          </div>
          <div style="padding:16px;background:rgba(186,117,23,.05);border-radius:8px;border:1px solid rgba(186,117,23,.12);">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
              <span style="width:24px;height:24px;border-radius:4px;background:rgba(186,117,23,.12);color:#BA7517;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;">B</span>
              <span style="font-size:12px;font-weight:700;color:rgba(12,20,40,.80);">가짜뉴스·루머</span>
            </div>
            <p id="module-b-score" style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:28px;color:#BA7517;">—</p>
            <p id="module-b-count" style="font-size:11px;color:rgba(12,20,40,.40);margin-top:2px;">— 건 탐지</p>
          </div>
          <div style="padding:16px;background:rgba(24,95,165,.05);border-radius:8px;border:1px solid rgba(24,95,165,.12);">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
              <span style="width:24px;height:24px;border-radius:4px;background:rgba(24,95,165,.12);color:#185FA5;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;">C</span>
              <span style="font-size:12px;font-weight:700;color:rgba(12,20,40,.80);">임직원 평판</span>
            </div>
            <p id="module-c-score" style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:28px;color:#185FA5;">—</p>
            <p id="module-c-count" style="font-size:11px;color:rgba(12,20,40,.40);margin-top:2px;">— 건 탐지</p>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script type="module">
import { api } from "/assets/js/api.js";

const PLATFORM_META = {
  instagram: { name:'Instagram',   abbr:'IG', color:'#e1306c' },
  x:         { name:'X (트위터)', abbr:'X',  color:'#334155' },
  youtube:   { name:'YouTube',     abbr:'YT', color:'#ff0000' },
  tiktok:    { name:'TikTok',      abbr:'TT', color:'#69c9d0' },
  naver:     { name:'Naver',       abbr:'NV', color:'#03c75a' },
};

function renderHealth(stats, risk, platformStats, sentimentTrend) {
  // ── 감성 비율: sentimentTrend 7일 합산 우선, 없으면 severity 추정 ──
  const totalNeg = sentimentTrend.negative.reduce((a,b)=>a+b,0);
  const totalPos = sentimentTrend.positive.reduce((a,b)=>a+b,0);
  const totalNeu = sentimentTrend.neutral.reduce((a,b)=>a+b,0);
  const sentTotal = totalNeg + totalPos + totalNeu;

  let negPct, posPct, neutPct;
  if (sentTotal > 0) {
    negPct  = Math.round(totalNeg / sentTotal * 100);
    posPct  = Math.round(totalPos / sentTotal * 100);
    neutPct = 100 - negPct - posPct;
  } else {
    // L2 분석 데이터 없을 때 severity로 추정
    const total = stats.total || 1;
    negPct  = Math.min(100, Math.round(((stats.critical + stats.high*0.7 + stats.medium*0.3) / total) * 100));
    posPct  = Math.max(0, Math.round((stats.low || 0) / total * 100));
    neutPct = Math.max(0, 100 - negPct - posPct);
  }

  // ── 건강도 지수 ──
  const healthScore = Math.max(0, Math.round(100 - risk.overall));
  const scoreEl = document.getElementById('health-score');
  scoreEl.textContent = healthScore;
  const color = healthScore >= 70 ? '#1D9E75' : healthScore >= 40 ? '#BA7517' : '#E24B4A';
  scoreEl.style.color = color;
  const labelEl = document.getElementById('health-label');
  labelEl.style.color = color;
  labelEl.textContent = healthScore >= 70 ? '브랜드 건강' : healthScore >= 40 ? '주의 필요' : '위기 상황';
  document.getElementById('metric-positive').textContent = posPct + '%';
  document.getElementById('metric-neutral').textContent  = neutPct + '%';
  document.getElementById('metric-negative').textContent = negPct + '%';

  // ── 감성 도넛 차트 ──
  const ctx = document.getElementById('sentimentChart');
  if (ctx && window.Chart) {
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['긍정', '중립', '부정'],
        datasets: [{ data:[posPct, neutPct, negPct], backgroundColor:['#1D9E75','#185FA5','#E24B4A'], borderWidth:0, hoverOffset:4 }]
      },
      options: {
        responsive:true, maintainAspectRatio:false, cutout:'72%',
        plugins: {
          legend: { display:false },
          tooltip: { callbacks: { label: c => ` ${c.label}: ${c.raw}%` } }
        }
      }
    });
    const legend = document.getElementById('sentiment-legend');
    const items = [{label:'긍정',val:posPct,c:'#1D9E75'},{label:'중립',val:neutPct,c:'#185FA5'},{label:'부정',val:negPct,c:'#E24B4A'}];
    legend.innerHTML = items.map(i=>`<div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;"><div style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:${i.c};flex-shrink:0;"></span><span style="color:rgba(12,20,40,.65);">${i.label}</span></div><span style="font-family:'JetBrains Mono',monospace;font-weight:700;color:${i.c};">${i.val}%</span></div>`).join('');
  }

  // ── 플랫폼별 위협 비율 (실제 데이터) ──
  const pb = document.getElementById('platform-bars');
  const active = platformStats.filter(p => p.count > 0);
  if (!active.length) {
    pb.innerHTML = '<p style="font-size:12px;color:rgba(12,20,40,.35);text-align:center;padding:20px 0;">스캔 데이터가 없습니다</p>';
  } else {
    const maxPct = Math.max(...active.map(p=>p.pct), 1);
    pb.innerHTML = active.map(p => {
      const m = PLATFORM_META[p.platform] || { name:p.platform, abbr:p.platform.slice(0,2).toUpperCase(), color:'#64748b' };
      return `<div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <div style="display:flex;align-items:center;gap:7px;">
            <span style="width:20px;height:20px;border-radius:3px;background:${m.color}18;color:${m.color};font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${m.abbr}</span>
            <span style="font-size:12px;color:rgba(12,20,40,.70);">${m.name}</span>
          </div>
          <span style="font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:700;color:#E24B4A;">${p.pct}%<span style="font-weight:400;color:rgba(12,20,40,.35);margin-left:4px;">(${p.count}건)</span></span>
        </div>
        <div style="height:5px;background:rgba(0,0,0,.06);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,${m.color},#E24B4A);transition:width 1s ease;" data-w="${Math.round(p.pct / maxPct * 100)}"></div>
        </div>
      </div>`;
    }).join('');
    requestAnimationFrame(()=>pb.querySelectorAll('[data-w]').forEach(b=>{b.style.width=b.getAttribute('data-w')+'%';}));
  }

  // ── 모듈별 점수 ──
  const ma = risk.module_a, mb = risk.module_b, mc = risk.module_c;
  document.getElementById('module-a-score').textContent = Math.round(ma.score);
  document.getElementById('module-a-count').textContent = ma.threat_count + '건 탐지';
  document.getElementById('module-b-score').textContent = Math.round(mb.score);
  document.getElementById('module-b-count').textContent = mb.threat_count + '건 탐지';
  document.getElementById('module-c-score').textContent = Math.round(mc.score);
  document.getElementById('module-c-count').textContent = mc.threat_count + '건 탐지';
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const [stats, risk, platformStats, sentimentTrend] = await Promise.all([
      api.stats(), api.riskScore(), api.platformStats(), api.sentimentTrend()
    ]);
    renderHealth(stats, risk, platformStats, sentimentTrend);
  } catch(e) { console.error(e); }
});
</script>
<script>
  document.addEventListener('DOMContentLoaded',function(){var t=document.getElementById('theme-toggle');if(t)t.addEventListener('click',function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('db-theme',n);});});
</script>
<script>
  fetch('/auth/me').then(r=>{if(!r.ok){location.href='/login';return;}return r.json();}).then(user=>{if(!user)return;document.getElementById('user-name').textContent=user.name||user.email;document.getElementById('user-email').textContent=user.email;if(user.avatar_url){const i=document.getElementById('user-avatar');i.src=user.avatar_url;i.style.display='block';document.getElementById('user-avatar-fallback').style.display='none';}else{document.getElementById('user-avatar-fallback').textContent=(user.name||user.email||'?')[0].toUpperCase();}}).catch(()=>{location.href='/login';});
</script>
<script src="/assets/js/white-label.js" defer></script>
<script src="/assets/js/mobile-nav.js"></script>
</body>
</html>
