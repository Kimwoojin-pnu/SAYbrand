<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAYbrand — 리포트</title>
  <script>(function(){var t=localStorage.getItem('db-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}());</script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#1a6ef8'}}}}}</script>
</head>
<body style="font-family:'NanumSquare','Noto Sans KR',sans-serif;background:var(--db-bg);color:var(--db-text-1);">
<div style="display:flex;height:100vh;overflow:hidden;">

  <!-- Sidebar -->
  <aside style="background:#0c1428;width:200px;flex-shrink:0;display:flex;flex-direction:column;">
    <a href="/" style="display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,0.08);text-decoration:none;">
      <div style="width:34px;height:34px;overflow:hidden;flex-shrink:0;"><img src="/saybrand-logo2.png" alt="" style="width:34px;height:auto;display:block;filter:brightness(1.8);" onerror="this.parentElement.style.display='none'" /></div>
      <span style="font-weight:700;font-size:15px;color:#ffffff;letter-spacing:-.02em;line-height:1;">SAYbrand</span>
    </a>
    <nav style="flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;">
      <a href="/dashboard" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>대시보드</a>
      <a href="/threats" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>현재 위협</a>
      <a href="/actions" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>처리해야할 사항</a>
      <a href="/brand-image" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>브랜드 이미지</a>
      <a href="/negative-mentions" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>피드백</a>
      <a href="/reports" class="db-nav-item db-nav-active"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>보고서</a>
    </nav>
    <div style="padding:12px 14px;border-top:1px solid rgba(255,255,255,0.08);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <img id="user-avatar" src="" alt="" style="width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;display:none;" />
        <div id="user-avatar-fallback" style="width:26px;height:26px;border-radius:50%;background:#1a6ef8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;">?</div>
        <div style="min-width:0;"><p id="user-name" style="font-size:11px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">로딩 중...</p><p id="user-email" style="font-size:10px;color:rgba(255,255,255,0.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></p></div>
      </div>
      <a href="/settings" class="db-nav-item" style="padding:5px 8px;font-size:11px;"><svg style="width:13px;height:13px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M20 12h2M2 12h2M12 20v2M12 2v2"/></svg>설정</a>
      <a href="/auth/logout" class="db-nav-item" style="padding:5px 8px;font-size:11px;"><svg style="width:13px;height:13px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>로그아웃</a>
    </div>
  </aside>

  <!-- Main -->
  <main class="db-main" style="flex:1;overflow-y:auto;background:var(--db-bg);">
    <header class="db-topheader" style="position:sticky;top:0;z-index:10;background:var(--db-surface);border-bottom:1px solid var(--db-border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h1 style="font-weight:800;font-size:15px;color:var(--db-text-1);letter-spacing:-.02em;">리포트</h1>
        <p style="font-size:10px;color:var(--db-text-3);margin-top:1px;">일간·주간 브랜드 위협 요약</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button onclick="loadReport('daily')" id="btn-daily" style="padding:5px 12px;border-radius:5px;background:#1a6ef8;border:none;color:#fff;font-size:12px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">일간</button>
        <button onclick="loadReport('weekly')" id="btn-weekly" style="padding:5px 12px;border-radius:5px;background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.10);color:rgba(12,20,40,0.55);font-size:12px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">주간</button>
        <button onclick="loadReport('monthly')" id="btn-monthly" style="padding:5px 12px;border-radius:5px;background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.10);color:rgba(12,20,40,0.55);font-size:12px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">월간</button>
        <button onclick="downloadPDF()" style="padding:5px 12px;border-radius:5px;background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.10);color:rgba(12,20,40,0.65);font-size:12px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;"><svg style="width:12px;height:12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PDF 다운로드</button>
        <button class="db-theme-toggle" id="theme-toggle" aria-label="다크모드 전환">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div style="padding:20px;display:flex;flex-direction:column;gap:16px;">

      <!-- Report header -->
      <div class="db-card" style="padding:18px 22px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div>
            <h2 id="report-title" style="font-weight:800;font-size:16px;letter-spacing:-.02em;">일간 위협 리포트</h2>
            <p id="report-period" style="font-size:11px;color:rgba(12,20,40,.40);margin-top:3px;font-family:'JetBrains Mono',monospace;">로딩 중...</p>
          </div>
          <span id="mock-tag" style="display:none;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;background:rgba(186,117,23,0.12);color:#BA7517;">[데모 데이터]</span>
        </div>
      </div>

      <!-- KPI row -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
        <div class="db-card">
          <p class="db-kpi-label">전체 위협</p>
          <p id="r-total" class="db-kpi-number">—</p>
          <p class="db-kpi-sub">수집 기간 내</p>
        </div>
        <div class="db-card">
          <p class="db-kpi-label">CRITICAL / HIGH</p>
          <p id="r-critical-high" class="db-kpi-number" style="color:#E24B4A;">—</p>
          <p class="db-kpi-sub">즉각 대응 필요</p>
        </div>
        <div class="db-card">
          <p class="db-kpi-label">해결 완료</p>
          <p id="r-resolved" class="db-kpi-number" style="color:#1D9E75;">—</p>
          <p class="db-kpi-sub">처리된 위협</p>
        </div>
        <div class="db-card">
          <p class="db-kpi-label">미해결</p>
          <p id="r-unresolved" class="db-kpi-number" style="color:#BA7517;">—</p>
          <p class="db-kpi-sub">활성 + 검토 중</p>
        </div>
      </div>

      <!-- 심각도별 + 플랫폼별 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="db-card">
          <h3 style="font-weight:700;font-size:13px;margin-bottom:14px;">심각도별 분포</h3>
          <div id="severity-bars"></div>
        </div>
        <div class="db-card">
          <h3 style="font-weight:700;font-size:13px;margin-bottom:14px;">플랫폼별 분포</h3>
          <div id="platform-bars"></div>
        </div>
      </div>

      <!-- 주요 위협 TOP 5 -->
      <div class="db-card" style="padding:0;overflow:hidden;">
        <div style="padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.06);">
          <h3 style="font-weight:700;font-size:13px;">주요 위협 TOP 5</h3>
        </div>
        <div id="top-threats" style="padding:14px 18px;">
          <p style="font-size:12px;color:rgba(12,20,40,.35);text-align:center;padding:24px;">로딩 중...</p>
        </div>
      </div>

    </div>
  </main>
</div>

<script>
(function(){var t=localStorage.getItem('db-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}());
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.getElementById('theme-toggle');
  if (toggle) toggle.addEventListener('click', function() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('db-theme', next);
  });
});
fetch('/auth/me').then(r => { if (!r.ok) { location.href = '/login'; return; } return r.json(); })
  .then(user => {
    if (!user) return;
    document.getElementById('user-name').textContent = user.name || user.email;
    document.getElementById('user-email').textContent = user.email;
    if (user.avatar_url) {
      const img = document.getElementById('user-avatar');
      img.src = user.avatar_url; img.style.display = 'block';
      document.getElementById('user-avatar-fallback').style.display = 'none';
    } else {
      document.getElementById('user-avatar-fallback').textContent = (user.name || user.email || '?')[0].toUpperCase();
    }
  }).catch(() => { location.href = '/login'; });

const SEV_COLOR = { critical: '#E24B4A', high: '#BA7517', medium: '#185FA5', low: '#1D9E75' };
const SEV_LABEL = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' };
const PLAT_COLOR = { instagram: '#e1306c', x: '#334155', youtube: '#ff0000', tiktok: '#69c9d0', naver: '#03c75a' };

function bar(label, count, total, color) {
  const pct = total ? Math.round(count / total * 100) : 0;
  return `<div style="margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;">
      <span style="color:#0c1428;">${label}</span>
      <span style="font-family:'JetBrains Mono',monospace;color:rgba(12,20,40,.55);">${count}건 (${pct}%)</span>
    </div>
    <div style="height:5px;background:rgba(0,0,0,.06);border-radius:3px;overflow:hidden;">
      <div style="height:100%;width:${pct}%;background:${color};border-radius:3px;transition:width .8s ease;"></div>
    </div>
  </div>`;
}

function renderReport(data) {
  const total = data.total_threats || 0;
  const byS = data.by_severity || {};
  const byP = data.by_platform || {};
  const resolved = data.resolved_count || 0;
  const ch = (byS.critical || 0) + (byS.high || 0);

  document.getElementById('r-total').textContent = total;
  document.getElementById('r-critical-high').textContent = ch;
  document.getElementById('r-resolved').textContent = resolved;
  document.getElementById('r-unresolved').textContent = total - resolved;
  document.getElementById('report-period').textContent = data.period || '';

  if (data.is_mock) document.getElementById('mock-tag').style.display = 'inline-block';
  else document.getElementById('mock-tag').style.display = 'none';

  const sevDiv = document.getElementById('severity-bars');
  if (total === 0) { sevDiv.innerHTML = '<p style="font-size:11px;color:rgba(12,20,40,.35);">수집된 위협이 없습니다.</p>'; }
  else { sevDiv.innerHTML = ['critical','high','medium','low'].map(s => bar(SEV_LABEL[s], byS[s] || 0, total, SEV_COLOR[s])).join(''); }

  const platDiv = document.getElementById('platform-bars');
  const platTotal = Object.values(byP).reduce((a, b) => a + b, 0) || 1;
  if (platTotal === 0) { platDiv.innerHTML = '<p style="font-size:11px;color:rgba(12,20,40,.35);">수집된 위협이 없습니다.</p>'; }
  else { platDiv.innerHTML = Object.entries(byP).sort((a,b) => b[1]-a[1]).map(([p, c]) => bar(p, c, platTotal, PLAT_COLOR[p] || '#6B7280')).join(''); }

  const top = data.top_threats || [];
  const topDiv = document.getElementById('top-threats');
  if (!top.length) {
    topDiv.innerHTML = '<p style="font-size:12px;color:rgba(12,20,40,.35);text-align:center;padding:24px;">탐지된 위협이 없습니다. 스캔을 실행해 보세요.</p>';
  } else {
    topDiv.innerHTML = top.map((t, i) => `
      <div style="display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.05);">
        <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:rgba(12,20,40,.25);flex-shrink:0;">${i+1}</span>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
            <span style="font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;background:${SEV_COLOR[t.severity]}1a;color:${SEV_COLOR[t.severity]};">${(t.severity||'').toUpperCase()}</span>
            <span style="font-size:11px;color:rgba(12,20,40,.45);">${t.platform || ''}</span>
            <span style="font-size:11px;font-family:'JetBrains Mono',monospace;color:rgba(12,20,40,.45);">${t.source_account || ''}</span>
          </div>
          <p style="font-size:12px;color:#0c1428;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.content_preview || ''}</p>
        </div>
        <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;flex-shrink:0;color:${SEV_COLOR[t.severity] || '#0c1428'};">${t.risk_score}</span>
      </div>`).join('');
  }
}

let _currentPeriod = 'daily';

function _setTabActive(type) {
  ['daily','weekly','monthly'].forEach(t => {
    const btn = document.getElementById('btn-' + t);
    if (!btn) return;
    btn.style.background = t === type ? '#1a6ef8' : 'rgba(0,0,0,0.05)';
    btn.style.color = t === type ? '#fff' : 'rgba(12,20,40,0.55)';
    btn.style.border = t === type ? 'none' : '1px solid rgba(0,0,0,0.10)';
  });
}

async function loadReport(type) {
  _currentPeriod = type;
  const titles = { daily: '일간 위협 리포트', weekly: '주간 위협 리포트', monthly: '월간 위협 리포트' };
  document.getElementById('report-title').textContent = titles[type] || '위협 리포트';
  _setTabActive(type);
  try {
    const res = await fetch(`/api/reports/${type}`);
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    renderReport(data);
  } catch (e) {
    document.getElementById('top-threats').innerHTML = `<p style="font-size:12px;color:#E24B4A;text-align:center;padding:24px;">리포트 로드 실패: ${e.message}</p>`;
  }
}

function downloadPDF() {
  window.open(`/api/reports/${_currentPeriod}/pdf`, '_blank');
}

loadReport('daily');
</script>
</body>
</html>
