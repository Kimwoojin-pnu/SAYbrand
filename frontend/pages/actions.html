<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAYbrand — 처리해야할 사항</title>
  <script>(function(){var t=localStorage.getItem('db-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}());</script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#1a6ef8'}}}}}</script>
</head>
<body style="font-family:'NanumSquare','Noto Sans KR',sans-serif;background:var(--db-bg);color:var(--db-text-1);">
<div style="display:flex;height:100vh;overflow:hidden;">

  <!-- Sidebar -->
  <aside style="background:#0c1428;width:200px;flex-shrink:0;display:flex;flex-direction:column;">
    <a href="/" style="display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,0.08);text-decoration:none;">
      <div style="width:34px;height:34px;overflow:hidden;flex-shrink:0;"><img src="/saybrand-logo2.png" alt="" style="width:34px;height:auto;display:block;filter:brightness(1.8);" onerror="this.parentElement.style.display='none'" /></div>
      <span style="font-weight:700;font-size:15px;color:#ffffff;letter-spacing:-.02em;line-height:1;">SAYbrand</span>
    </a>
    <nav style="flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;">
      <a href="/dashboard" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>대시보드</a>
      <a href="/threats" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>현재 위협</a>
      <a href="/actions" class="db-nav-item db-nav-active"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>처리해야할 사항</a>
      <a href="/brand-image" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>브랜드 이미지</a>
      <a href="/negative-mentions" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>피드백</a>
      <a href="/reports" class="db-nav-item"><svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>보고서</a>
    </nav>
    <div style="padding:12px 14px;border-top:1px solid rgba(255,255,255,0.08);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <img id="user-avatar" src="" alt="" style="width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;display:none;" />
        <div id="user-avatar-fallback" style="width:26px;height:26px;border-radius:50%;background:#1a6ef8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;">?</div>
        <div style="min-width:0;"><p id="user-name" style="font-size:11px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">로딩 중...</p><p id="user-email" style="font-size:10px;color:rgba(255,255,255,0.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></p></div>
      </div>
      <a href="/settings" class="db-nav-item" style="padding:5px 8px;font-size:11px;"><svg style="width:13px;height:13px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M20 12h2M2 12h2M12 20v2M12 2v2"/></svg>설정</a>
      <a href="/auth/logout" class="db-nav-item" style="padding:5px 8px;font-size:11px;"><svg style="width:13px;height:13px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>로그아웃</a>
    </div>
  </aside>

  <!-- Main -->
  <main class="db-main" style="flex:1;overflow-y:auto;background:var(--db-bg);">
    <header class="db-topheader" style="position:sticky;top:0;z-index:10;background:var(--db-surface);border-bottom:1px solid var(--db-border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h1 style="font-weight:800;font-size:15px;color:var(--db-text-1);letter-spacing:-.02em;">처리해야할 사항</h1>
        <p style="font-size:10px;color:var(--db-text-3);margin-top:1px;">미처리 위협 우선순위 큐</p>
      </div>
      <button class="db-theme-toggle" id="theme-toggle" aria-label="다크모드 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <div style="padding:20px;display:flex;flex-direction:column;gap:16px;">

      <!-- KPI -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
        <div class="db-card">
          <p class="db-kpi-label">미처리 긴급</p>
          <p id="kpi-urgent" class="db-kpi-number" style="color:#E24B4A;">—</p>
          <p class="db-kpi-sub">Critical + High 활성</p>
        </div>
        <div class="db-card">
          <p class="db-kpi-label">검토 진행중</p>
          <p id="kpi-reviewing" class="db-kpi-number" style="color:#185FA5;">—</p>
          <p class="db-kpi-sub">처리 중인 건수</p>
        </div>
        <div class="db-card">
          <p class="db-kpi-label">전체 미처리</p>
          <p id="kpi-pending" class="db-kpi-number" style="color:rgba(12,20,40,.55);">—</p>
          <p class="db-kpi-sub">Active + Reviewing</p>
        </div>
      </div>

      <!-- Filter -->
      <div style="display:flex;gap:2px;background:rgba(0,0,0,.04);border-radius:6px;padding:3px;width:fit-content;">
        <button class="filter-btn active" data-filter="all">전체 미처리</button>
        <button class="filter-btn" data-filter="active">활성만</button>
        <button class="filter-btn" data-filter="reviewing">검토중만</button>
      </div>

      <!-- Action list -->
      <div id="action-list"></div>
    </div>
  </main>
</div>
<div id="toast-wrap" style="position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>

<script type="module">
import { api } from "/assets/js/api.js";
import { timeAgo, severityBadge, moduleBadge, platformIcon, scoreColor } from "/assets/js/utils.js";

const SEV_ORDER = { critical:0, high:1, medium:2, low:3 };
const SEV_COLOR = { critical:'#E24B4A', high:'#BA7517', medium:'#185FA5', low:'#1D9E75' };
const TYPE_MAP = { logo_spoof:'로고 사칭', account_impersonation:'계정 사칭', organized_rumor:'조직적 루머', viral_rumor:'바이럴 루머', executive_exposure:'임직원 노출', bot_attack:'봇 공격', reputation_attack:'평판 공격', negative_review_cluster:'부정 리뷰 클러스터', internal_info_leak:'내부 정보 유출', watermark_removal:'워터마크 제거', negative_comment:'부정 댓글', casual_mention:'일반 언급', competitor_mention:'경쟁사 언급', similar_logo:'유사 로고' };
const SUGGEST = { critical:'즉각 법무팀 연락 및 플랫폼 신고 절차 개시', high:'당일 내 담당자 지정 후 대응 방안 검토', medium:'주간 리포트에 포함, 모니터링 강화', low:'정기 리포트 기록 후 추이 관찰' };

let allThreats = [];
let currentFilter = 'all';

function showToast(msg, type='success') {
  const wrap=document.getElementById('toast-wrap'); if(!wrap)return;
  const colors={success:'#1D9E75',error:'#E24B4A'}; const color=colors[type]||'#1D9E75';
  const el=document.createElement('div'); el.style.cssText=`display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--db-surface);border:1px solid var(--db-border);border-left:3px solid ${color};border-radius:8px;box-shadow:rgba(12,20,40,.14) 0 4px 16px;font-size:12px;font-family:'NanumSquare',sans-serif;pointer-events:auto;transform:translateX(120%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);min-width:240px;`;
  el.innerHTML=`<span style="width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0;"></span><span style="color:var(--db-text-1);">${msg}</span>`;
  wrap.appendChild(el); requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transform='translateX(0)';}));
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .4s';setTimeout(()=>el.remove(),400);},3500);
}

function getFiltered() {
  if (currentFilter==='active') return allThreats.filter(t=>t.status==='active');
  if (currentFilter==='reviewing') return allThreats.filter(t=>t.status==='reviewing');
  return allThreats;
}

function renderList() {
  const list = document.getElementById('action-list');
  const items = getFiltered().sort((a,b)=>(SEV_ORDER[a.severity]??9)-(SEV_ORDER[b.severity]??9)||(b.risk_score-a.risk_score));
  if (!items.length) { list.innerHTML=`<div class="db-card" style="padding:40px;text-align:center;color:rgba(12,20,40,.38);">처리할 사항이 없습니다</div>`; return; }
  list.innerHTML = items.map(t=>{
    const sc = SEV_COLOR[t.severity]||'#94a3b8';
    return `<div class="db-card" style="padding:16px 18px;border-left:3px solid ${sc};">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
            ${severityBadge(t.severity)} ${moduleBadge(t.module)}
            <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:${scoreColor(t.risk_score)};">${t.risk_score}점</span>
          </div>
          <p style="font-weight:700;font-size:13px;color:#0c1428;font-family:'JetBrains Mono',monospace;margin-bottom:4px;">${t.source_account}</p>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:rgba(12,20,40,.55);">${platformIcon(t.platform)} ${t.platform}</span>
            <span style="font-size:10px;color:rgba(12,20,40,.38);font-family:'JetBrains Mono',monospace;">${timeAgo(t.detected_at)}</span>
            <span style="font-size:10px;color:rgba(12,20,40,.40);">${TYPE_MAP[t.threat_type]||t.threat_type}</span>
          </div>
          <p style="font-size:12px;color:rgba(12,20,40,.60);line-height:1.5;margin-bottom:8px;">${(t.content_preview||'').slice(0,100)}${(t.content_preview||'').length>100?'…':''}</p>
          <div style="background:rgba(29,158,117,0.06);border-radius:5px;padding:8px 10px;">
            <p style="font-size:10px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;color:#1D9E75;margin-bottom:3px;">권고 대응</p>
            <p style="font-size:11px;color:rgba(12,20,40,.65);">${t.ai_response_suggestion||(SUGGEST[t.severity]||'담당자 확인 후 대응')}</p>
          </div>
        </div>
        <div style="flex-shrink:0;display:flex;flex-direction:column;gap:6px;min-width:88px;">
          ${t.status!=='reviewing'?`<button onclick="window._changeStatus(${t.id},'reviewing')" style="padding:6px 10px;border-radius:4px;font-size:11px;font-family:'NanumSquare',sans-serif;font-weight:700;cursor:pointer;border:1px solid rgba(24,95,165,.3);color:#185FA5;background:transparent;white-space:nowrap;">검토중</button>`:''}
          <button onclick="window._changeStatus(${t.id},'resolved')" style="padding:6px 10px;border-radius:4px;font-size:11px;font-family:'NanumSquare',sans-serif;font-weight:700;cursor:pointer;border:1px solid rgba(29,158,117,.3);color:#1D9E75;background:transparent;white-space:nowrap;">해결됨</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function updateKPIs() {
  const active = allThreats.filter(t=>t.status==='active');
  const reviewing = allThreats.filter(t=>t.status==='reviewing');
  const urgent = active.filter(t=>t.severity==='critical'||t.severity==='high');
  document.getElementById('kpi-urgent').textContent = urgent.length;
  document.getElementById('kpi-reviewing').textContent = reviewing.length;
  document.getElementById('kpi-pending').textContent = allThreats.length;
}

window._changeStatus = async function(id, status) {
  try {
    await api.updateStatus(id, status);
    const t = allThreats.find(x=>x.id===id);
    if (status==='resolved') { allThreats = allThreats.filter(x=>x.id!==id); }
    else if (t) { t.status = status; }
    updateKPIs(); renderList();
    showToast({reviewing:'검토중',resolved:'해결됨'}[status]+' 처리 완료');
  } catch(e){ showToast('상태 변경 실패','error'); }
};

async function load() {
  try {
    const [active, reviewing] = await Promise.all([
      api.threats({status:'active', page:1, page_size:50}),
      api.threats({status:'reviewing', page:1, page_size:50})
    ]);
    allThreats = [...active.items, ...reviewing.items];
    updateKPIs(); renderList();
  } catch(e){ document.getElementById('action-list').innerHTML=`<div class="db-card" style="padding:40px;text-align:center;color:rgba(12,20,40,.38);">데이터 로딩 실패</div>`; }
}

document.addEventListener('DOMContentLoaded',()=>{
  load();
  document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{
    currentFilter=b.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x===b));
    renderList();
  }));
});
</script>
<script>
  document.addEventListener('DOMContentLoaded',function(){var t=document.getElementById('theme-toggle');if(t)t.addEventListener('click',function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('db-theme',n);});});
</script>
<script>
  fetch('/auth/me').then(r=>{if(!r.ok){location.href='/login';return;}return r.json();}).then(user=>{if(!user)return;document.getElementById('user-name').textContent=user.name||user.email;document.getElementById('user-email').textContent=user.email;if(user.avatar_url){const i=document.getElementById('user-avatar');i.src=user.avatar_url;i.style.display='block';document.getElementById('user-avatar-fallback').style.display='none';}else{document.getElementById('user-avatar-fallback').textContent=(user.name||user.email||'?')[0].toUpperCase();}}).catch(()=>{location.href='/login';});
</script>
</body>
</html>
