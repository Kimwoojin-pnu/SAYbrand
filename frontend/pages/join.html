<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a6ef8" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <script src="/assets/js/pwa.js" defer></script>
  <title>SAYbrand — 조직 참여</title>
  <script>(function(){var t=localStorage.getItem('db-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}());</script>
  <link rel="stylesheet" href="/assets/css/custom.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#1a6ef8',600:'#1558cc'}}}}}</script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes pulse-ring {
      0%   { transform: scale(0.8); opacity: 0.6; }
      50%  { transform: scale(1.1); opacity: 0.2; }
      100% { transform: scale(0.8); opacity: 0.6; }
    }
    .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }
  </style>
</head>
<body style="font-family:'NanumSquare','Noto Sans KR',sans-serif;background:var(--db-bg);color:var(--db-text-1);min-height:100vh;display:flex;align-items:center;justify-content:center;">

<div style="width:100%;max-width:440px;padding:24px;">

  <!-- ── 초대코드 입력 화면 ──────────────────────────────────── -->
  <div id="screen-input" style="background:var(--db-surface);border:1px solid var(--db-border);border-radius:16px;padding:32px;">
    <div style="text-align:center;margin-bottom:28px;">
      <a href="/" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:20px;">
        <img src="/saybrand-logo2.png" alt="" style="width:28px;height:auto;" onerror="this.style.display='none'" />
        <span style="font-weight:800;font-size:16px;color:var(--db-text-1);">SAYbrand</span>
      </a>
      <h1 style="font-size:20px;font-weight:800;color:var(--db-text-1);margin-bottom:6px;">초대코드로 참여</h1>
      <p style="font-size:13px;color:var(--db-text-3);">받은 초대코드 8자리를 입력하세요</p>
    </div>

    <div style="margin-bottom:20px;">
      <input id="code-input" type="text" maxlength="8" placeholder="ABCD1234"
        style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--db-border);background:var(--db-bg);color:var(--db-text-1);font-size:20px;font-family:'JetBrains Mono',monospace;font-weight:700;text-align:center;letter-spacing:0.15em;text-transform:uppercase;outline:none;box-sizing:border-box;"
        oninput="this.value=this.value.toUpperCase()" />
    </div>

    <button id="btn-join"
      style="width:100%;padding:13px;border-radius:10px;background:#1a6ef8;border:none;color:#fff;font-size:14px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;margin-bottom:12px;">
      참여하기
    </button>

    <div id="join-result" style="display:none;padding:12px 14px;border-radius:8px;font-size:13px;text-align:center;margin-bottom:12px;"></div>

    <div style="margin-top:16px;text-align:center;">
      <a href="/dashboard" style="font-size:12px;color:var(--db-text-3);text-decoration:none;">← 대시보드로 돌아가기</a>
    </div>
  </div>

  <!-- ── 승인 대기 화면 ─────────────────────────────────────── -->
  <div id="screen-pending" style="display:none;background:var(--db-surface);border:1px solid var(--db-border);border-radius:16px;padding:32px;">
    <div style="text-align:center;margin-bottom:28px;">
      <a href="/" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:20px;">
        <img src="/saybrand-logo2.png" alt="" style="width:28px;height:auto;" onerror="this.style.display='none'" />
        <span style="font-weight:800;font-size:16px;color:var(--db-text-1);">SAYbrand</span>
      </a>

      <!-- 대기 아이콘 -->
      <div style="position:relative;width:72px;height:72px;margin:0 auto 16px;">
        <div class="pulse-ring" style="position:absolute;inset:0;border-radius:50%;border:2px solid #1a6ef8;"></div>
        <div style="position:absolute;inset:8px;border-radius:50%;background:rgba(26,110,248,0.12);display:flex;align-items:center;justify-content:center;">
          <svg style="width:26px;height:26px;color:#1a6ef8;" viewBox="0 0 24 24" fill="none" stroke="#1a6ef8" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
      </div>

      <h1 style="font-size:18px;font-weight:800;color:var(--db-text-1);margin-bottom:8px;">승인 대기 중</h1>
      <p style="font-size:13px;color:var(--db-text-3);line-height:1.6;">
        <strong id="pending-org-name" style="color:var(--db-text-1);"></strong> 조직에<br>
        가입 요청을 보냈습니다.<br>
        관리자가 승인하면 자동으로 이동합니다.
      </p>

      <!-- 역할 뱃지 -->
      <div style="margin-top:12px;">
        <span id="pending-role-badge" style="display:inline-block;padding:3px 12px;border-radius:20px;background:rgba(124,58,237,0.1);color:#7c3aed;font-size:11px;font-weight:700;"></span>
      </div>

      <!-- 폴링 상태 -->
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;">
        <svg class="spinner" style="width:12px;height:12px;color:#1a6ef8;" viewBox="0 0 24 24" fill="none" stroke="#1a6ef8" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        <span style="font-size:11px;color:var(--db-text-3);">승인 여부를 확인하는 중...</span>
      </div>
    </div>

    <!-- 액션 버튼들 -->
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button id="btn-cancel-request"
        style="width:100%;padding:11px;border-radius:9px;border:1.5px solid rgba(220,38,38,0.3);background:transparent;color:#dc2626;font-size:13px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">
        요청 취소 (재요청 가능)
      </button>
      <button onclick="location.href='/dashboard'"
        style="width:100%;padding:11px;border-radius:9px;background:#1a6ef8;border:none;color:#fff;font-size:13px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">
        내 대시보드로 이동
      </button>
      <button onclick="location.href='/orgs/new'"
        style="width:100%;padding:11px;border-radius:9px;border:1px solid var(--db-border);background:transparent;color:var(--db-text-2);font-size:13px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">
        새 조직 직접 만들기
      </button>
    </div>

    <p style="margin-top:16px;text-align:center;font-size:11px;color:var(--db-text-3);">
      요청을 취소하면 같은 코드로 다시 요청할 수 있습니다
    </p>
  </div>

  <!-- ── 승인 완료 화면 ─────────────────────────────────────── -->
  <div id="screen-approved" style="display:none;background:var(--db-surface);border:1px solid var(--db-border);border-radius:16px;padding:32px;text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(22,163,74,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <svg style="width:28px;height:28px;" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h2 style="font-size:18px;font-weight:800;color:var(--db-text-1);margin-bottom:8px;">승인되었습니다!</h2>
    <p style="font-size:13px;color:var(--db-text-3);margin-bottom:20px;">잠시 후 대시보드로 이동합니다...</p>
    <button onclick="location.href='/dashboard'"
      style="padding:11px 28px;border-radius:9px;background:#16a34a;border:none;color:#fff;font-size:13px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">
      지금 이동
    </button>
  </div>

  <!-- ── 거절 화면 ──────────────────────────────────────────── -->
  <div id="screen-rejected" style="display:none;background:var(--db-surface);border:1px solid var(--db-border);border-radius:16px;padding:32px;text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(220,38,38,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <svg style="width:28px;height:28px;" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <h2 style="font-size:18px;font-weight:800;color:var(--db-text-1);margin-bottom:8px;">요청이 거절되었습니다</h2>
    <p style="font-size:13px;color:var(--db-text-3);margin-bottom:20px;">관리자가 가입 요청을 거절했습니다.<br>같은 코드로 다시 요청할 수 있습니다.</p>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button onclick="showScreen('input')"
        style="width:100%;padding:11px;border-radius:9px;background:#1a6ef8;border:none;color:#fff;font-size:13px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">
        다시 요청하기
      </button>
      <button onclick="location.href='/dashboard'"
        style="width:100%;padding:11px;border-radius:9px;border:1px solid var(--db-border);background:transparent;color:var(--db-text-2);font-size:13px;font-weight:700;font-family:'NanumSquare',sans-serif;cursor:pointer;">
        내 대시보드로 이동
      </button>
    </div>
  </div>

</div>

<script>
let pendingOrgId = null;
let pollTimer = null;

function showScreen(name) {
  ['input','pending','approved','rejected'].forEach(s => {
    document.getElementById('screen-' + s).style.display = 'none';
  });
  document.getElementById('screen-' + name).style.display = 'block';
}

// ── 페이지 로드 시 기존 pending 요청 확인 ────────────────────
(async function checkExistingPending() {
  try {
    const res = await fetch('/api/orgs/my-pending');
    if (!res.ok) return;
    const list = await res.json();
    if (list.length) {
      const req = list[0];
      pendingOrgId = req.org_id;
      document.getElementById('pending-org-name').textContent = req.org_name;
      document.getElementById('pending-role-badge').textContent = roleLabel(req.role) + ' 권한 요청 중';
      showScreen('pending');
      startPolling();
    }
  } catch (_) {}
})();

// ── 초대코드 제출 ─────────────────────────────────────────────
document.getElementById('btn-join').addEventListener('click', joinOrg);
document.getElementById('code-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinOrg(); });

async function joinOrg() {
  const code = document.getElementById('code-input').value.trim();
  if (code.length !== 8) { showResult('코드는 8자리입니다.', false); return; }

  const btn = document.getElementById('btn-join');
  btn.disabled = true;
  btn.textContent = '처리 중...';

  try {
    const res = await fetch('/api/orgs/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const data = await res.json();
    if (res.ok) {
      if (data.status === 'active') {
        showScreen('approved');
        setTimeout(() => location.href = '/dashboard', 1800);
      } else if (data.status === 'pending') {
        pendingOrgId = data.org_id;
        // org_name은 별도 조회
        const pending = await fetch('/api/orgs/my-pending').then(r => r.ok ? r.json() : []);
        const req = pending.find(p => p.org_id === data.org_id) || {};
        document.getElementById('pending-org-name').textContent = req.org_name || '조직';
        document.getElementById('pending-role-badge').textContent = roleLabel(req.role || 'member') + ' 권한 요청 중';
        showScreen('pending');
        startPolling();
      }
    } else {
      showResult(data.detail || '오류가 발생했습니다.', false);
    }
  } catch (_) {
    showResult('네트워크 오류가 발생했습니다.', false);
  } finally {
    btn.disabled = false;
    btn.textContent = '참여하기';
  }
}

function showResult(msg, success) {
  const el = document.getElementById('join-result');
  el.style.display = 'block';
  el.style.background = success ? 'rgba(22,163,74,0.1)' : 'rgba(220,38,38,0.1)';
  el.style.color = success ? '#16a34a' : '#dc2626';
  el.style.border = `1px solid ${success ? 'rgba(22,163,74,0.2)' : 'rgba(220,38,38,0.2)'}`;
  el.textContent = msg;
}

// ── 요청 취소 ─────────────────────────────────────────────────
document.getElementById('btn-cancel-request').addEventListener('click', async () => {
  if (!pendingOrgId) return;
  const btn = document.getElementById('btn-cancel-request');
  btn.disabled = true;
  btn.textContent = '취소 중...';
  try {
    await fetch(`/api/orgs/${pendingOrgId}/leave`, { method: 'DELETE' });
    stopPolling();
    pendingOrgId = null;
    document.getElementById('code-input').value = '';
    document.getElementById('join-result').style.display = 'none';
    showScreen('input');
  } catch (_) {
    btn.disabled = false;
    btn.textContent = '요청 취소 (재요청 가능)';
  }
});

// ── 폴링 (5초마다 승인 여부 확인) ────────────────────────────
function startPolling() {
  stopPolling();
  pollTimer = setInterval(poll, 5000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

async function poll() {
  if (!pendingOrgId) return;
  try {
    // active 확인
    const activeOrgs = await fetch('/api/orgs').then(r => r.ok ? r.json() : []);
    if (activeOrgs.some(o => o.id === pendingOrgId)) {
      stopPolling();
      showScreen('approved');
      setTimeout(() => location.href = '/dashboard', 1800);
      return;
    }
    // pending 여부 확인 (없으면 거절됨)
    const pending = await fetch('/api/orgs/my-pending').then(r => r.ok ? r.json() : null);
    if (pending !== null && !pending.some(p => p.org_id === pendingOrgId)) {
      stopPolling();
      showScreen('rejected');
    }
  } catch (_) {}
}

function roleLabel(role) {
  return { owner:'Owner', admin:'Admin', member:'Member', viewer:'Viewer' }[role] || role;
}
</script>
</body>
</html>
