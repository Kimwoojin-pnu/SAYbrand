version: "3.9"
services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: saybrand
      POSTGRES_USER: saybrand
      POSTGRES_PASSWORD: localpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A backend.workers.celery_app worker --loglevel=info -B
    environment:
      DATABASE_URL: postgresql+asyncpg://saybrand:localpass@postgres:5432/saybrand
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - postgres
      - redis

  flower:
    build: .
    command: celery -A backend.workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  pgdata:
